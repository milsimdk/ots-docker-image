name: Watch External Repo Release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT: needed to see tags
          
      - name: Get last stored release
        run: |
          echo "OLD_RELEASE=$(gh variable get LAST_OTS_RELEASE || echo none)" >> $GITHUB_ENV

      - name: Fetch latest external release
        run: |
          LATEST=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/OWNER/EXTERNAL_REPO/releases/latest \
            | jq -r .tag_name)

          echo "NEW_RELEASE=$LATEST" >> $GITHUB_ENV
      
      - name: Stop if no new release
        if: env.NEW_RELEASE == env.OLD_RELEASE
        run: echo "No new external release"
      
      - name: Check if tag exists
        if: env.NEW_RELEASE != env.OLD_RELEASE
        id: tagcheck
        run: |
          if git rev-parse "refs/tags/${NEW_RELEASE}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git tag "${NEW_RELEASE}"
          git push origin "${NEW_RELEASE}"

      - name: Trigger docker publish workflow
        if: env.NEW_RELEASE != env.OLD_RELEASE
        run: |
          echo "Triggering docker-publish.yml for $NEW_RELEASE"

          gh workflow run docker-publish.yml \
            -f release_tag="$NEW_RELEASE"

      - name: Update stored release
        if: env.NEW_RELEASE != env.OLD_RELEASE
        run: |
          gh variable set LAST_OTS_RELEASE --body "$NEW_RELEASE"
