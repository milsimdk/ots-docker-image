name: Watch External Repo Release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensures we have all tags
          
      - name: Get last stored release
        run: |
          echo "OLD_RELEASE=$(gh variable get LAST_OTS_RELEASE || echo none)" >> $GITHUB_ENV

      - name: Fetch latest external release
        run: |
          LATEST=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/brian7704/OpenTAKServer/releases/latest \
            | jq -r .tag_name)

          echo "NEW_RELEASE=$LATEST" >> $GITHUB_ENV
      
      - name: Stop if no new release
        if: env.NEW_RELEASE == env.OLD_RELEASE
        run: |
          echo "No new external release detected. Skipping..."
          exit_with_success # This stops the workflow with a success status
      
      - name: Check if tag exists
        id: tagcheck
        run: |
          if git rev-parse "refs/tags/${NEW_RELEASE}" >/dev/null 2>&1; then
            echo "Tag ${NEW_RELEASE} already exists. Skipping..."
            exit_with_success # This stops the workflow with a success status
          else
            echo "Tag ${NEW_RELEASE} does not exist. Proceeding..."
          fi

        
      - name: Create and push git tag + update .env
        run: |

          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Update .env before creating the tag
          echo "BUILD_VERSION=${NEW_RELEASE}" > .env
          git add .env
          git commit -m "Update .env with BUILD_VERSION=${NEW_RELEASE}"

          # Create and push both the tag and the commit
          git tag "${NEW_RELEASE}"
          git push origin HEAD --tags
          
      - name: Trigger docker publish workflow
        run: |
          gh workflow run docker-publish.yml \
            -f release_tag="$NEW_RELEASE"

      - name: Update stored release
        run: |
          gh variable set LAST_OTS_RELEASE --body "$NEW_RELEASE"
