name: Watch External Repo Release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
    GH_TOKEN: ${{ github.token }}
    
jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensures we have all tags
          
      - name: Load .env variables
        id: dotenv
        uses: falti/dotenv-action@v1.1.5
           
      - name: Fetch latest external release
        run: |
          LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/brian7704/OpenTAKServer/releases/latest \
            | jq -r .tag_name)

          echo "NEW_RELEASE=$LATEST" >> $GITHUB_ENV
      
      - name: Stop if no new release
        if: env.NEW_RELEASE == ${{ steps.dotenv.outputs.BUILD_VERSION }}
        run: |
          echo "No new external release detected. Skipping..."
      
      - name: Check if tag exists
        if: env.NEW_RELEASE != ${{ steps.dotenv.outputs.BUILD_VERSION }}
        id: tagcheck
        run: |
          if git rev-parse "refs/tags/${NEW_RELEASE}" >/dev/null 2>&1; then
            echo "Tag ${NEW_RELEASE} already exists. Skipping..."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${NEW_RELEASE} does not exist. Proceeding..."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

        
      - name: Create and push git tag + update .env
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Update .env before creating the tag
          echo "BUILD_VERSION=v${NEW_RELEASE}" > .env
          git add .env
          git commit -m "Update .env with BUILD_VERSION=v${NEW_RELEASE}"

          # Create and push both the tag and the commit
          git tag "v${NEW_RELEASE}"
          git push origin HEAD --tags
